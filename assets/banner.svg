<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="100%">
  <defs>
    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#181d26" stroke-width="1" />
    </pattern>

    <!-- Subtle Dot Matrix Pattern -->
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#212834" />
    </pattern>

    <!-- Ambient Glow -->
    <radialGradient id="terrGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#B54A1D" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#B54A1D" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0E1116" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B54A1D" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#E06D3B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#21262D" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B54A1D" stop-opacity="0" />
      <stop offset="50%" stop-color="#E06D3B" stop-opacity="1" />
      <stop offset="100%" stop-color="#F79361" stop-opacity="0" />
    </linearGradient>

    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace;
      }
      .title {
        font-size: 32px;
        font-weight: 700;
        fill: #F0F6FC;
        letter-spacing: -0.5px;
      }
      .accent-text {
        fill: #D96230;
        font-style: italic;
        font-weight: 700;
      }
      .subtitle {
        font-size: 13.5px;
        fill: #9CA6B2;
        letter-spacing: 0.3px;
      }
      .hud-label {
        font-size: 10.5px;
        fill: #7D8590;
        letter-spacing: 1.4px;
      }
      .node-box {
        fill: #131820;
        stroke: #262C36;
        stroke-width: 1.2;
        rx: 6px;
      }
      .node-id {
        font-size: 9.5px;
        fill: #D96230;
        letter-spacing: 1px;
        font-weight: 600;
      }
      .node-title {
        font-size: 11.5px;
        fill: #E6EDF3;
        font-weight: 600;
      }
      .node-sub {
        font-size: 10px;
        fill: #7D8590;
      }

      /* Animated Signal Pulse along Bus */
      @keyframes busFlow {
        0% {
          stroke-dashoffset: 820;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      .signal-bus {
        stroke: #D96230;
        stroke-width: 2;
        stroke-dasharray: 90 730;
        animation: busFlow 4.8s linear infinite;
      }

      /* Sequential Node Highlighting */
      @keyframes nodeGlow {
        0%, 100% {
          stroke: #262C36;
          fill: #131820;
        }
        12%, 28% {
          stroke: #D96230;
          fill: #191D24;
        }
      }
      @keyframes ledPulse {
        0%, 100% {
          fill: #30363D;
        }
        12%, 28% {
          fill: #E06D3B;
        }
      }
      .n1 { animation: nodeGlow 4.8s infinite 0.0s; }
      .n2 { animation: nodeGlow 4.8s infinite 1.1s; }
      .n3 { animation: nodeGlow 4.8s infinite 2.3s; }
      .n4 { animation: nodeGlow 4.8s infinite 3.5s; }

      .led1 { animation: ledPulse 4.8s infinite 0.0s; }
      .led2 { animation: ledPulse 4.8s infinite 1.1s; }
      .led3 { animation: ledPulse 4.8s infinite 2.3s; }
      .led4 { animation: ledPulse 4.8s infinite 3.5s; }

      /* Live Status Beacon */
      @keyframes beacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.88); }
      }
      .status-dot {
        fill: #D96230;
        animation: beacon 2.4s ease-in-out infinite;
        transform-origin: 36px 29px;
      }

      /* Cursor Blink */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        fill: #D96230;
        animation: blink 1.1s infinite;
      }

      /* Subtle Waveform Drift */
      @keyframes waveDrift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -240; }
      }
      .telemetry-wave {
        fill: none;
        stroke: #B54A1D;
        stroke-width: 1.2;
        stroke-opacity: 0.45;
        stroke-dasharray: 6 4;
        animation: waveDrift 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="878" height="266" rx="10" fill="#0E1116" stroke="#21262D" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="264" rx="9" fill="url(#grid)" />
  <rect x="2" y="2" width="876" height="264" rx="9" fill="url(#terrGlow)" />

  <!-- Top Telemetry Header Bar -->
  <circle cx="36" cy="29" r="4" class="status-dot" />
  <circle cx="36" cy="29" r="7.5" fill="none" stroke="#B54A1D" stroke-width="1" stroke-opacity="0.4" />
  <text x="52" y="33" class="mono hud-label">SYS.ENG // FIRST-PRINCIPLES ARCHITECTURE</text>
  <text x="848" y="33" text-anchor="end" class="mono hud-label">KHANKENDI · AZERBAIJAN</text>

  <!-- Header Divider Line -->
  <line x1="28" y1="47" x2="852" y2="47" stroke="#21262D" stroke-width="1" />
  <line x1="28" y1="47" x2="260" y2="47" stroke="url(#accentLine)" stroke-width="2" />

  <!-- Hero Identity -->
  <text x="32" y="96" class="sans title">
    Elnur <tspan class="accent-text">Məmmədov</tspan>
  </text>

  <!-- Terminal Subtitle with Animated Cursor -->
  <text x="32" y="124" class="mono subtitle">
    <tspan fill="#D96230" font-weight="600">&gt;</tspan> Cross-Disciplinary Engineering: Software, Hardware, Mechanics &amp; Electronics <tspan class="cursor">&#9646;</tspan>
  </text>

  <!-- Decorative Right Corner Telemetry Matrix -->
  <g transform="translate(740, 68)">
    <rect x="0" y="0" width="108" height="44" rx="4" fill="#11161D" stroke="#21262D" stroke-width="1" />
    <text x="10" y="16" class="mono" font-size="9" fill="#7D8590">LAYER_SPAN</text>
    <text x="10" y="30" class="mono" font-size="10" fill="#D96230" font-weight="600">HW &#8596; KERNEL &#8596; AI</text>
    <path d="M 88 12 L 98 12 L 98 22" fill="none" stroke="#B54A1D" stroke-width="1.2" />
  </g>

  <!-- Schematic Pipeline Bus (Base + Animated Signal) -->
  <line x1="40" y1="192" x2="840" y2="192" stroke="#21262D" stroke-width="2" />
  <line x1="40" y1="192" x2="840" y2="192" class="signal-bus" />

  <!-- Node 1: Mechanics & Electronics -->
  <g transform="translate(28, 154)">
    <rect x="0" y="0" width="192" height="74" class="node-box n1" />
    <circle cx="176" cy="16" r="3.2" class="led1" />
    <text x="14" y="20" class="mono node-id">01 // PHYSICAL</text>
    <text x="14" y="41" class="sans node-title">Hardware &amp; Mechanics</text>
    <text x="14" y="59" class="mono node-sub">Electronics · Sensors · CAD</text>
  </g>

  <!-- Bus Arrow 1->2 -->
  <path d="M 225 188 L 231 192 L 225 196" fill="none" stroke="#7D8590" stroke-width="1.3" />

  <!-- Node 2: Embedded & Systems -->
  <g transform="translate(238, 154)">
    <rect x="0" y="0" width="192" height="74" class="node-box n2" />
    <circle cx="176" cy="16" r="3.2" class="led2" />
    <text x="14" y="20" class="mono node-id">02 // LOW-LEVEL</text>
    <text x="14" y="41" class="sans node-title">Systems &amp; Embedded</text>
    <text x="14" y="59" class="mono node-sub">C/C++ · Firmware · Linux</text>
  </g>

  <!-- Bus Arrow 2->3 -->
  <path d="M 435 188 L 441 192 L 435 196" fill="none" stroke="#7D8590" stroke-width="1.3" />

  <!-- Node 3: Algorithms & ML -->
  <g transform="translate(448, 154)">
    <rect x="0" y="0" width="192" height="74" class="node-box n3" />
    <circle cx="176" cy="16" r="3.2" class="led3" />
    <text x="14" y="20" class="mono node-id">03 // COMPUTATION</text>
    <text x="14" y="41" class="sans node-title">Algorithms &amp; ML</text>
    <text x="14" y="59" class="mono node-sub">ICPC · PyTorch · Sequence/CV</text>
  </g>

  <!-- Bus Arrow 3->4 -->
  <path d="M 645 188 L 651 192 L 645 196" fill="none" stroke="#7D8590" stroke-width="1.3" />

  <!-- Node 4: Autonomy & Deployment -->
  <g transform="translate(658, 154)">
    <rect x="0" y="0" width="194" height="74" class="node-box n4" />
    <circle cx="178" cy="16" r="3.2" class="led4" />
    <text x="14" y="20" class="mono node-id">04 // INTEGRATION</text>
    <text x="14" y="41" class="sans node-title">Autonomous Systems</text>
    <text x="14" y="59" class="mono node-sub">Robotics · Control · Real-Time</text>
  </g>

  <!-- Bottom Telemetry Oscilloscope Trace -->
  <path d="M 28 248 Q 80 242, 130 248 T 230 248 T 330 245 T 430 250 T 530 246 T 630 249 T 730 245 T 852 248" class="telemetry-wave" />
</svg>
